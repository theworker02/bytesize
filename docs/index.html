  <main class="wrap">
    <section class="card">
      <h2>Purpose</h2>
      <p>Parse sizes like 1.5KiB and 2MB into bytes, and format integer bytes as IEC units.</p>
      <h2>Install</h2>
      <pre><code>npm install -g bytesize</code></pre>
      <h2>Usage</h2>
      <pre><code>bytesize 1.5KiB
bytesize 1536</code></pre>
